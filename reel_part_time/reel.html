r la pensione.", "text": "[g]TFR[/g], [g]13ª[/g], [g]FERIE[/g]. E I [g]CONTRIBUTI[/g] PER LA PENSIONE", "start": 55.0, "end": 59.71, "dur": 4.71, "s0": 55.1, "s1": 59.531}, {"id": "b18", "visual": "deadline", "say": "Per lo stipendio, di solito, hai cinque anni dalla fine del rapporto.", "text": "PER LO STIPENDIO, DI SOLITO, HAI [g]5 ANNI[/g] DALLA FINE DEL RAPPORTO", "start": 59.71, "end": 63.87, "dur": 4.16, "s0": 59.81, "s1": 63.761}, {"id": "b19", "visual": "alarm", "say": "Ma i contributi si prescrivono mentre lavori: meglio non aspettare.", "text": "MA I CONTRIBUTI SI PRESCRIVONO MENTRE LAVORI: [r]MEGLIO NON ASPETTARE[/r]", "start": 63.87, "end": 68.32, "dur": 4.45, "s0": 63.97, "s1": 68.145}, {"id": "b20", "visual": "proofs", "say": "E ricorda: tutto si gioca sulle prove.", "text": "E RICORDA: TUTTO SI GIOCA [r]SULLE PROVE[/r]", "start": 68.32, "end": 71.07, "dur": 2.75, "s0": 68.42, "s1": 70.868}, {"id": "b21", "visual": "proofs", "say": "Timbrature, turni su WhatsApp, mail mandate alle sette di sera, colleghi pronti a testimoniare.", "text": "[g]TIMBRATURE[/g], [g]TURNI SU WHATSAPP[/g], [g]MAIL[/g] ALLE 19:00, [g]COLLEGHI[/g] PRONTI A TESTIMONIARE", "start": 71.07, "end": 77.42, "dur": 6.35, "s0": 71.17, "s1": 77.286}, {"id": "b22", "visual": "notebook", "say": "E da oggi, segnati ogni giorno a che ora entri e a che ora esci.", "text": "E DA OGGI, SEGNATI OGNI GIORNO [g]A CHE ORA ENTRI[/g] E [g]A CHE ORA ESCI[/g]", "start": 77.42, "end": 81.71, "dur": 4.29, "s0": 77.52, "s1": 81.519}, {"id": "b23", "visual": "sixteen", "say": "Perché se il contratto dice ventiquattro ore, e tu ne fai quaranta,", "text": "PERCHÉ SE IL CONTRATTO DICE [g]24 ORE[/g] E TU NE FAI [r]40[/r],", "start": 81.71, "end": 85.56, "dur": 3.85, "s0": 81.81, "s1": 85.436}, {"id": "b24", "visual": "sixteen", "say": "quelle sedici ore non sono sparite. E nemmeno i tuoi diritti.", "text": "QUELLE 16 ORE [r]NON SONO SPARITE[/r]. E NEMMENO I TUOI DIRITTI", "start": 85.56, "end": 89.3, "dur": 3.7 const W=1080, H=1920;
const INK="#18181b", PAPER="#ffffff", SHADOW="#e4e4e7", GREY="#a1a1aa", LIGHT="#f4f4f5";

   su Instagram il fondo dello schermo è coperto da didascalia e pulsanti. */
const ART_SCALE=0.86, ART_TOP=600;

/* ---------- easing ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutCubic=x=>1-Math.pow(1-x,3);
function easeOutBack(x){const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

/* ================= primitive SVG ================= */
const ln=(x1,y1,x2,y2,w=8,c=INK)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const pth=(d,fill="none",w=8,c=INK,extra="")=>`<path d="${d}" fill="${fill}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const cir=(x,y,r,fill="none",w=8,c=INK)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${c}" stroke-width="${w}"/>`;
const rct=(x,y,w,h,rx,fill,sw=7,c=INK)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${c}" stroke-width="${sw}"/>`;
const txt=(x,y,s,size,color=INK,anchor="middle",extra="")=>
  `<text x="${x}" y="${y}" font-family="${HAND}" font-size="${size}" fill="${color}" text-anchor="${anchor}" letter-spacing="1.5" ${extra}>${s}</text>`;
/* come txt, ma riduce il corpo se la scritta non entra in maxW */
const fitTxt=(x,y,s,maxW,size,color=INK,anchor="middle")=>{
  const est=s.length*size*0.74;
  return txt(x,y,s,est>maxW?size*maxW/est:size,color,anchor);
};
const sans=(x,y,s,size,color=INK,anchor="middle")=>
  `<text x="${x}" y="${y}" font-family="Inter,sans-serif" font-weight="700" font-size="${size}" fill="${color}" text-anchor="${anchor}">${s}</text>`;
const G=(inner,tr="")=>`<g${tr?` transform="${tr}"`:""}>${inner}</g>`;
/* wrapper animato: from/until = istanti (id battuta, "bXX:PAROLA", "bXX+0.4"), inn = tipo di entrata */
const A=(inner,o={})=>{
  const at=[];
  if(o.from)  at.push(`data-from="${o.from}"`);
  if(o.until) at.push(`data-until="${o.until}"`);
  if(o.inn)   at.push(`data-in="${o.inn}"`);
  if(o.loop)  at.push(`data-loop="${o.loop}"`);
  if(o.origin)at.push(`data-origin="${o.origin}"`);
  if(o.name)  at.push(`data-name="${o.name}"`);
  return `<g ${at.join(" ")}>${inner}</g>`;
};
/* segnetti "splendenti" attorno a un punto (come nel riferimento) */
function sparkle(x,y,r=46,col=GREEN,n=3,a0=-60,spread=60){
  let s="";
  for(let i=0;i<n;i++){
    const a=(a0+(i-(n-1)/2)*spread/(n-1||1))*Math.PI/180;
    s+=ln(x+Math.cos(a)*r,y+Math.sin(a)*r,x+Math.cos(a)*(r+30),y+Math.sin(a)*(r+30),7,col);
  }
  return s;
}
const qmark=(x,y,size=110)=>txt(x,y,"?",size,INK);
const xmark=(x,y,r=60,c=RED)=>ln(x-r,y-r,x+r,y+r,15,c)+ln(x+r,y-r,x-r,y+r,15,c);
const check=(x,y,r=60,c=GREEN)=>pth(`M ${x-r} ${y} L ${x-r*0.3} ${y+r*0.7} L ${x+r} ${y-r*0.8}`,"none",16,c);
const dropSweat=(x,y,s=1)=>`<path d="M ${x} ${y} q ${16*s} ${24*s} 0 ${38*s} q ${-16*s} ${-14*s} 0 ${-38*s} Z" fill="#93c5fd" stroke="${INK}" stroke-width="4"/>`;

/* ================= il personaggio =================
   Omino "col maglione": testa ovale, ricci castani, occhiali tondi, naso a virgola,
   guance rosate, maglione indaco chiaro con scollo a V e colletto della camicia,
   maniche e pantaloni "a tubo", mani a guanto chiaro, scarpe nere.
   Coordinate locali: piedi a y=0, asse del corpo x=0. Altezza ~ 910 px a s=1.
   l / r = posizione della mano rispetto alla spalla [dx, dy] (dy positivo = in basso).
*/
const SKIN="#fdf0e4", CHEEK="#fecaca", GLOVE="#ffffff", PANTS="#52525b";
const HAIRC={curly:"#8a5a3b", bun:"#4a3222", spiky:"#27272a", grey:"#d4d4d8"};
/* forma "a nuvola": unione di cerchi con un solo contorno esterno */
function blob(pts,fill,ow=7){
  let out="", inn="";
  for(const [x,y,r] of pts){
    out+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r+ow/2).toFixed(1)}" fill="${INK}"/>`;
    inn+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r-ow/2).toFixed(1)}" fill="${fill}"/>`;
  }
  return out+inn;
}
function guy(o){
  o=Object.assign({x:540,y:1760,s:1,look:0.3,face:'smile',brows:'neutral',eyes:'dot',
    glasses:false,body:'shirt',tie:null,hair:'curly',l:[-40,235],r:[40,235],lh:'dot',rh:'dot',
    bendL:34,bendR:34,sweat:false,blush:false,cheeks:true,shadow:true,name:'guy',mustache:false,
    legs:'stand',flip:false,behind:'',front:''},o);
  const L=o.look*30, P=[];
  const HY=-742, HRX=118, HRY=134;               // testa ovale
  const BT=-626, BB=-296;                         // maglione: scollo / orlo
  const SH=[-74,-566], SHR=[74,-566];             // spalle (attacco delle maniche)
  const suit=o.body==='suit';
  const COL={shirt:"#c7d2fe", suit:"#3f3f46", blue:"#dbeafe", green:GREEN_SOFT}[o.body]||"#c7d2fe";
  const RIB={shirt:"#a5b4fc", suit:"#3f3f46", blue:"#bfdbfe", green:"#a7f3d0"}[o.body]||"#a5b4fc";
  const TRIM={shirt:INDIGO, blue:"#60a5fa", green:"#34d399"}[o.body]||INDIGO;   // bordo dello scollo
  const SLEEVE=suit?"#52525b":COL;                                             // manica del capo più chiara della giacca
  const tube=(d,w,fill,ow=6)=>pth(d,"none",w+ow*2,INK)+pth(d,"none",w,fill);

  /* segno di matita sotto i piedi (niente ombra a ellisse) */
  if(o.shadow){ const sw=o.legs==='sit'?190:128;
    P.push(pth(`M ${-sw} 12 Q ${-sw*0.2} 22 ${sw} 6`,"none",7,"#d4d4d8")+pth(`M ${-sw*0.62} 27 Q ${-sw*0.2} 33 ${sw*0.2} 28`,"none",5,"#e4e4e7")); }
  P.push(o.behind);

  /* gambe: pantaloni a tubo + scarpe */
  const shoe=(x,dir)=>`<path d="M ${x-dir*18} 2 Q ${x-dir*20} -28 ${x+dir*10} -28 Q ${x+dir*46} -26 ${x+dir*48} 2 Z" fill="${INK}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
  if(o.legs==='stand'){
    P.push(tube(`M -42 ${BB-20} L -46 -22`,24,PANTS)+tube(`M 42 ${BB-20} L 46 -22`,24,PANTS));
    P.push(shoe(-48,-1)+shoe(48,1));
  } else if(o.legs==='walk'){
    P.push(tube(`M -36 ${BB-20} L -92 -22`,28,PANTS)+tube(`M 36 ${BB-20} L 72 -150 L 100 -22`,28,PANTS));
    P.push(shoe(-96,-1)+shoe(104,1));
  }

  /* busto: trapezio arrotondato (spalle strette, orlo largo) */
  const bodyD=`M -48 ${BT} Q -90 ${BT+2} -96 ${BT+50} L -112 ${BB-26} Q -114 ${BB} -86 ${BB}`+
              ` L 86 ${BB} Q 114 ${BB} 112 ${BB-26} L 96 ${BT+50} Q 90 ${BT+2} 48 ${BT} Z`;
  P.push(pth(bodyD,COL,8));
  if(suit){
    /* giacca del capo: camicia bianca, cravatta scura, revers, bottoni */
    P.push(`<path d="M -44 ${BT+2} L 0 ${BT+128} L 44 ${BT+2} Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
    P.push(`<path d="M -10 ${BT+26} L 10 ${BT+26} L 14 ${BT+112} L 0 ${BT+130} L -14 ${BT+112} Z" fill="${INK}"/>`);
    P.push(pth(`M -50 ${BT+6} L -26 ${BT+70} L -40 ${BT+78} L -8 ${BT+150}`,"none",5));
    P.push(pth(`M 50 ${BT+6} L 26 ${BT+70} L 40 ${BT+78} L 8 ${BT+150}`,"none",5));
    P.push(`<circle cx="0" cy="${BT+190}" r="7" fill="#a1a1aa"/><circle cx="0" cy="${BT+240}" r="7" fill="#a1a1aa"/>`);
  } else {
    /* maglione: orlo a costine, scollo a V con colletto della camicia */
    P.push(`<path d="M -111 ${BB-34} L 111 ${BB-34} L 112 ${BB-26} Q 114 ${BB} 86 ${BB} L -86 ${BB} Q -114 ${BB} -112 ${BB-26} Z" fill="${RIB}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`);
    for(let x=-84;x<=84;x+=28) P.push(ln(x,BB-24,x,BB-10,4,"rgba(24,24,27,0.35)"));
    P.push(`<path d="M -50 ${BT+2} L 0 ${BT+96} L 50 ${BT+2} Z" fill="${TRIM}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`);
    P.push(`<path d="M -36 ${BT+2} L 0 ${BT+74} L 36 ${BT+2} Z" fill="${PAPER}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
    if(o.tie) P.push(`<path d="M -8 ${BT+40} L 8 ${BT+40} L 10 ${BT+70} L 0 ${BT+80} L -10 ${BT+70} Z" fill="${o.tie}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`);
    P.push(`<path d="M -38 ${BT+4} L -4 ${BT+30} L -30 ${BT+54} Z" fill="${PAPER}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
    P.push(`<path d="M 38 ${BT+4} L 4 ${BT+30} L 30 ${BT+54} Z" fill="${PAPER}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
  }

  /* braccia: manica a tubo + mano a guanto */
  const arm=(S,d,side,bend,kind)=>{
    if(d[1]>180) d=[d[0],180+(d[1]-180)*0.3];     // braccia a riposo: la mano resta sopra l'orlo
    const hx=S[0]+d[0], hy=S[1]+d[1];
    const vx=hx-S[0], vy=hy-S[1], len=Math.hypot(vx,vy)||1;
    let px=-vy/len, py=vx/len;
    if(px*side<0){px=-px;py=-py;}
    const cx=(S[0]+hx)/2+px*bend, cy=(S[1]+hy)/2+py*bend;
    const tl=Math.hypot(hx-cx,hy-cy)||1, ux=(hx-cx)/tl, uy=(hy-cy)/tl;
    let s=tube(`M ${S[0]} ${S[1]} Q ${cx} ${cy} ${hx-ux*12} ${hy-uy*12}`,24,SLEEVE);
    if(suit) s+=ln(hx-ux*34,hy-uy*34,hx-ux*14,hy-uy*14,24,PAPER).replace('stroke-linecap="round"','stroke-linecap="butt"')+
                ln(hx-ux*34-uy*12,hy-uy*34+ux*12,hx-ux*34+uy*12,hy-uy*34-ux*12,4);
    s+=hand(hx,hy,kind,ux,uy,side);
    return s;
  };
  /* mano: palmo tondo + dita a tubo, un solo contorno */
  const glove=(x,y,fingers)=>{
    let out=`<circle cx="${x}" cy="${y}" r="23" fill="${INK}"/>`, inn=`<circle cx="${x}" cy="${y}" r="17" fill="${GLOVE}"/>`;
    for(const [x2,y2,w] of fingers){ out+=ln(x,y,x2,y2,w+12,INK); inn+=ln(x,y,x2,y2,w,GLOVE); }
    return out+inn;
  };
  const hand=(x,y,kind,ux,uy,side)=>{
    if(kind==='none') return '';
    if(kind==='point'){ // indice lungo + pollice alzato a "L": non si confonde col pugno
      const a=Math.atan2(uy,ux), t=a-side*1.25;
      return glove(x,y,[[x+Math.cos(a)*52,y+Math.sin(a)*52,12],[x+Math.cos(t)*26,y+Math.sin(t)*26,11]]);
    }
    if(kind==='up')    return glove(x,y,[[x,y-44,12]]);
    if(kind==='thumb'){ // pugno chiuso + pollice in su
      const tx=x-side*10, d=`M ${tx} ${y-12} L ${tx} ${y-50}`;
      return `<rect x="${x-24}" y="${y-20}" width="48" height="42" rx="15" fill="${INK}"/>`+pth(d,"none",28,INK)+
        `<rect x="${x-18}" y="${y-14}" width="36" height="30" rx="10" fill="${GLOVE}"/>`+pth(d,"none",15,GLOVE)+
        ln(x-side*14,y-1,x+side*16,y-1,4)+ln(x-side*14,y+9,x+side*16,y+9,4);
    }
    if(kind==='open')  return glove(x,y,[[x-side*20,y-42,11],[x+side*4,y-48,11],[x+side*24,y-40,11],[x+side*36,y-6,11]]);
    return glove(x,y,[]);
  };

  /* orecchie e testa */
  P.push(`<ellipse cx="${-HRX+4}" cy="${HY+12}" rx="20" ry="27" fill="${SKIN}" stroke="${INK}" stroke-width="7"/>`);
  P.push(`<ellipse cx="${HRX-4}" cy="${HY+12}" rx="20" ry="27" fill="${SKIN}" stroke="${INK}" stroke-width="7"/>`);
  P.push(`<ellipse cx="0" cy="${HY}" rx="${HRX}" ry="${HRY}" fill="${SKIN}" stroke="${INK}" stroke-width="8"/>`);

  /* capelli */
  if(o.hair==='curly'){
    // ricci morbidi: corona di riccioli sulla calotta + frangetta mossa
    const pts=[];
    for(let i=0;i<=8;i++){ const a=(-166+i*19)*Math.PI/180; pts.push([Math.cos(a)*(HRX-8),HY+Math.sin(a)*(HRY-12),i%2?28:26]); }
    [[-86,-832,24],[-52,-842,25],[-16,-846,25],[20,-845,25],[56,-838,24],[88,-826,22],
     [-50,-868,30],[0,-876,30],[50,-868,30],[-120,-760,19],[120,-760,19]].forEach(p=>pts.push(p));
    P.push(blob(pts,HAIRC.curly));
    const dk="#5b3a26";
    P.push(pth(`M -62 -866 q 12 -14 24 -2`,"none",5,dk)+pth(`M 10 -872 q 14 -12 26 2`,"none",5,dk)+
           pth(`M -98 -800 q 6 -16 20 -12`,"none",5,dk)+pth(`M 74 -848 q 12 -10 22 4`,"none",5,dk));
  } else if(o.hair==='grey'){
    // capo: pelato, ciuffi grigi arruffati sopra le orecchie
    P.push(blob([[-112,-770,22],[-124,-742,20],[-100,-790,18]],HAIRC.grey,6)+
           blob([[112,-770,22],[124,-742,20],[100,-790,18]],HAIRC.grey,6));
    P.push(pth(`M -44 ${HY-HRY+18} q 18 -8 38 -6`,"none",5,"#ffffff"));
  } else if(o.hair==='bun'){
    const c=HAIRC.bun;
    P.push(`<path d="M ${-HRX+2} ${HY+14} Q ${-HRX-10} ${HY-HRY-8} 0 ${HY-HRY-6} Q ${HRX+10} ${HY-HRY-8} ${HRX-2} ${HY+14} Q ${HRX-26} ${HY-74} 0 ${HY-84} Q ${-HRX+26} ${HY-74} ${-HRX+2} ${HY+14} Z" fill="${c}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`);
    P.push(cir(0,HY-HRY-30,36,c,7));
  } else if(o.hair==='spiky'){
    P.push(`<path d="M -104 ${HY-54} L -96 ${HY-118} L -70 ${HY-96} L -58 ${HY-156} L -30 ${HY-116} L -4 ${HY-164} L 18 ${HY-118} L 48 ${HY-158} L 58 ${HY-110} L 92 ${HY-134} L 104 ${HY-54} Q 0 ${HY-96} -104 ${HY-54} Z" fill="${HAIRC.spiky}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`);
  }

  /* faccia */
  const ey=HY+2, exL=L-42, exR=L+42;
  const eye=(x)=>{
    if(o.eyes==='sly')   return `<path d="M ${x-11} ${ey-1} A 11 11 0 0 0 ${x+11} ${ey-1} Z" fill="${INK}"/>`+ln(x-15,ey-3,x+15,ey-3,5);
    if(o.eyes==='tired') return `<path d="M ${x-10} ${ey+1} A 10 9 0 0 0 ${x+10} ${ey+1} Z" fill="${INK}"/>`+ln(x-15,ey,x+15,ey,5)+pth(`M ${x-12} ${ey+16} q 12 7 24 0`,"none",3,GREY);
    if(o.eyes==='wide')  return cir(x,ey,14,PAPER,4)+`<circle cx="${x}" cy="${ey}" r="6" fill="${INK}"/>`;
    if(o.eyes==='closed')return pth(`M ${x-13} ${ey+2} q 13 -13 26 0`,"none",6);
    return o.glasses ? `<circle cx="${x}" cy="${ey}" r="10" fill="${INK}"/><circle cx="${x+3}" cy="${ey-4}" r="3" fill="#fff"/>`
                     : `<ellipse cx="${x}" cy="${ey}" rx="11" ry="14" fill="${INK}"/><circle cx="${x+3}" cy="${ey-5}" r="3.5" fill="#fff"/>`;
  };
  /* guance: sempre un filo di rosa, più accese se blush */
  const ck=o.blush?{c:"#fca5a5",op:0.95,rx:24,ry:13}:{c:CHEEK,op:0.8,rx:17,ry:10};
  if(o.blush||o.cheeks){
    P.push(`<ellipse cx="${exL-12}" cy="${ey+46}" rx="${ck.rx}" ry="${ck.ry}" fill="${ck.c}" opacity="${ck.op}"/>`);
    P.push(`<ellipse cx="${exR+12}" cy="${ey+46}" rx="${ck.rx}" ry="${ck.ry}" fill="${ck.c}" opacity="${ck.op}"/>`);
  }
  P.push(eye(exL)+eye(exR));
  if(o.glasses){
    P.push(cir(exL,ey,31,"rgba(255,255,255,0.25)",6)+cir(exR,ey,31,"rgba(255,255,255,0.25)",6));
    P.push(pth(`M ${exL+31} ${ey-4} q ${(exR-exL-62)/2} -12 ${exR-exL-62} 0`,"none",6));
    if(o.look>=0) P.push(ln(exL-31,ey-6,-HRX+6,ey-12,6)); else P.push(ln(exR+31,ey-6,HRX-6,ey-12,6));
  }
  const by=ey-52;
  const brow=(x,side)=>{
    const b=o.brows;
    if(b==='up')      return pth(`M ${x-22} ${by} q 22 -16 44 0`,"none",8);
    if(b==='worried') return ln(x-20,by+(side<0?4:-8),x+20,by+(side<0?-8:4),8);
    if(b==='angry')   return ln(x-20,by+(side<0?-8:6),x+20,by+(side<0?6:-8),8);
    if(b==='sly')     return side<0 ? ln(x-20,by+2,x+20,by+2,8) : pth(`M ${x-22} ${by+4} q 24 -20 46 -6`,"none",8);
    return pth(`M ${x-20} ${by+2} q 20 -8 40 -2`,"none",8);
  };
  P.push(brow(exL,-1)+brow(exR,1));
  /* naso a virgola */
  P.push(pth(`M ${L+4} ${ey+20} q 18 8 8 26 q -4 4 -12 2`,"none",6));
  const mx=L+6, my=HY+76;
  const f=o.face;
  if(f==='smile')      P.push(pth(`M ${mx-30} ${my-8} Q ${mx} ${my+20} ${mx+30} ${my-8}`,"none",7));
  else if(f==='smirk') P.push(pth(`M ${mx-26} ${my+2} Q ${mx+4} ${my+14} ${mx+30} ${my-10}`,"none",7));
  else if(f==='flat')  P.push(ln(mx-22,my+2,mx+22,my+2,7));
  else if(f==='sad')   P.push(pth(`M ${mx-26} ${my+10} Q ${mx} ${my-12} ${mx+26} ${my+10}`,"none",7));
  else if(f==='o')     P.push(`<ellipse cx="${mx}" cy="${my+4}" rx="13" ry="16" fill="${INK}"/>`);
  else if(f==='grin')  P.push(`<path d="M ${mx-34} ${my-10} Q ${mx} ${my+40} ${mx+34} ${my-10} Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`);
  else if(f==='wavy')  P.push(pth(`M ${mx-28} ${my+4} q 9 -9 18 0 q 9 9 18 0 q 9 -9 18 0`,"none",6));
  else if(f==='shh')   P.push(`<ellipse cx="${mx}" cy="${my+2}" rx="11" ry="8" fill="${INK}"/>`);
  if(o.mustache) P.push(`<path d="M ${mx-56} ${my-8} q 14 -24 56 -14 q 42 -10 56 14 q -26 -2 -56 0 q -30 -2 -56 0 Z" fill="${HAIRC.grey}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
  if(o.sweat) P.push(dropSweat(HRX+28,HY-100,1.1));

  /* braccia: dopo la testa, così una mano vicino al viso resta visibile */
  P.push(arm(SH,o.l,-1,o.bendL,o.lh));
  P.push(arm(SHR,o.r,1,o.bendR,o.rh));
  P.push(o.front);

  const tr=`translate(${o.x},${o.y}) scale(${o.flip?-o.s:o.s},${o.s})`;
  return `<g transform="${tr}" data-fig="${o.name}">${P.join("")}</g>`;
}

function clock(x,y,r,hh,mm,{face=PAPER,rim=INK,spin=null,label=null,labelCol=INK}={}){
  let s=cir(0,0,r,face,Math.max(6,r/14),rim);
  for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=ln(Math.cos(a)*r*0.78,Math.sin(a)*r*0.78,Math.cos(a)*r*0.88,Math.sin(a)*r*0.88,i%3?4:7);}
  const ah=((hh%12)+mm/60)*30-90, am=mm*6-90;
  const hand=(ang,len,w)=>ln(0,0,Math.cos(ang*Math.PI/180)*len,Math.sin(ang*Math.PI/180)*len,w);
  if(spin){
    s+=A(hand(ah,r*0.5,10),{from:spin,loop:"spin:0.35",origin:"0 0"});
    s+=A(hand(am,r*0.72,7),{from:spin,loop:"spin:3.2",origin:"0 0"});
  } else s+=hand(ah,r*0.5,10)+hand(am,r*0.72,7);
  s+=`<circle cx="0" cy="0" r="${r/12}" fill="${INK}"/>`;
  if(label) s+=txt(0,r+64,label,54,labelCol);
  return G(s,`translate(${x},${y})`);
}

/* ================= costruzione ================= */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* peso di ogni carattere nel "tempo di lettura": le pause della voce cadono sulla punteggiatura */
function weight(ch){
  if(/[.?!:]/.test(ch)) return 4.2;
  if(ch===',') return 3.2;
  if(ch===' ') return 0.6;
  return 1;
}
/* "[g]PAROLA[/g] ..." -> html a caratteri singoli + testo piano (per le parole-cue) */
function buildCaption(src){
  let cls=null, html="", plain="", cum=[], acc=0, word="";
  const flushWord=()=>{ if(word){ html+=`<span class="w">${word}</span>`; word=""; } };
  let i=0;
  while(i<src.length){
    const m=src.slice(i).match(/^\[(\/?)([gri])\]/);
    if(m){ cls = m[1] ? null : m[2]; i+=m[0].length; continue; }
    const ch=src[i];
    cum.push(acc); acc+=weight(ch);
    const span=`<span class="c${cls?" "+cls:""}" data-k="${plain.length}">${esc(ch)}</span>`;
    if(ch===' '){ flushWord(); html+=span; } else word+=span;
    plain+=ch; i++;
  }
  flushWord();
  return {html, plain, cum, total:acc};
}

let SEGS=null;
function buildScenes(){
  const stage=document.getElementById('stage');
  const beats=TIMELINE.beats;
  // battute consecutive con lo stesso visual = una sola scena (niente stacco)
  const segs=[];
  for(const bt of beats){
    const last=segs[segs.length-1];
    if(last && last.visual===bt.visual) { last.beats.push(bt); last.end=bt.end; }
    else segs.push({visual:bt.visual, beats:[bt], start:bt.start, end:bt.end});
  }
  for(const sg of segs){
    const div=document.createElement('div');
    div.className='scene'; div.id='scene-'+sg.visual+'-'+sg.beats[0].id;
    const art=(ART[sg.visual]||(()=>''))(sg.beats.map(x=>x.id));
    let html=`<svg class="art" viewBox="0 0 ${W} ${H}"><g class="cam">${art}</g></svg>`;
    sg.caps=[];
    for(const bt of sg.beats){
      const c=buildCaption(bt.text);
      html+=`<div class="cap" id="cap-${bt.id}">${c.html}</div>`;
      sg.caps.push({bt, ...c});
    }
    if(sg.visual==='hook') html+=`<div class="tag" id="tag-parte">PARTE 1</div>`;
    div.innerHTML=html;
    stage.appendChild(div);
    sg.dom=div;
    sg.caps.forEach(c=>{ c.el=div.querySelector('#cap-'+c.bt.id); c.chars=[...c.el.querySelectorAll('.c')]; });
  }
  return segs;
}

/* istante assoluto di una parola nel testo di una battuta */
function cueTime(seg, spec){
  const [bid, rest] = spec.split(/:(.*)/s);
  const cap = seg.caps.find(c=>c.bt.id===bid);
  if(!cap) throw new Error('battuta sconosciuta '+bid+' nel visual '+seg.visual);
  const idx = cap.plain.indexOf(rest);
  if(idx<0) throw new Error(`parola "${rest}" non trovata in ${bid}: ${cap.plain}`);
  return cap.bt.s0 + (cap.cum[idx]/cap.total)*(cap.bt.s1-cap.bt.s0) - 0.04;
}
function resolveTime(seg, spec){
  if(spec==null) return null;
  let off=0;
  const mo=spec.match(/^(.*?)([+-]\d+(\.\d+)?)$/);
  if(mo && !spec.includes(':')){ spec=mo[1]; off=parseFloat(mo[2]); }
  if(spec.includes(':')) return cueTime(seg, spec)+off;
  const bt=seg.beats.find(x=>x.id===spec);
  if(!bt) throw new Error('battuta sconosciuta '+spec);
  return bt.start+off;
}

/* Se una didascalia supera 4 righe, rimpicciolisce il font finché ci sta. */
function fitCaptions(){
  document.querySelectorAll('.cap').forEach(el=>{
    let fs=parseFloat(getComputedStyle(el).fontSize), guard=0;
    const lh=()=>parseFloat(getComputedStyle(el).lineHeight);
    while(el.getBoundingClientRect().height > lh()*4+2 && fs>40 && guard++<40){ fs-=2; el.style.fontSize=fs+'px'; }
  });
}

function ready(){
  if(SEGS) return;
  SEGS=buildScenes();
  document.querySelectorAll('.scene').forEach(d=>d.style.display='block');
  document.querySelectorAll('.cap').forEach(d=>d.style.display='block');
  fitCaptions();
  for(const sg of SEGS){
    sg.anims=[...sg.dom.querySelectorAll('svg [data-from],svg [data-until],svg [data-loop]')].map(el=>{
      const bb=el.getBBox();
      const a={el, from:resolveTime(sg, el.getAttribute('data-from')),
        until:resolveTime(sg, el.getAttribute('data-until')),
        inn:el.getAttribute('data-in')||'pop', loop:el.getAttribute('data-loop'),
        base:el.getAttribute('transform')||'', cx:bb.x+bb.width/2, cy:bb.y+bb.height/2, bb};
      const og=el.getAttribute('data-origin');
      if(og){ const [ox,oy]=og.split(' ').map(Number); a.ox=ox; a.oy=oy; } else { a.ox=a.cx; a.oy=a.cy; }
      if(a.inn==='draw'){ el.querySelectorAll('ellipse,path').forEach(p=>{ const L=p.getTotalLength?p.getTotalLength():1000; p.style.strokeDasharray=L; p.dataset.len=L; }); }
      if(a.inn==='write'){ const t=el.querySelector('text'); a.textW=t.getComputedTextLength(); a.tx=+t.getAttribute('x'); }
      return a;
    });
    const tag=sg.dom.querySelector('#tag-parte');
    if(tag){
      const c=sg.caps[0].el.getBoundingClientRect();
      tag.style.top=(c.bottom+30)+'px';
      sg.tagAt=sg.caps[0].bt.s1+0.1;
    }
  }
  document.querySelectorAll('.cap').forEach(d=>d.style.display='none');
  document.querySelectorAll('.scene').forEach(d=>d.style.display='none');
}

function applyAnim(a,t){
  const el=a.el;
  let op=1, tr='';
  const T=t-(a.from??-1e9);
  if(a.from!=null){
    if(T<0) op=0;
    else if(a.inn==='pop'){
      const p=clamp(T/0.38,0,1), k=0.4+0.6*easeOutBack(p);
      op=clamp(p*2.5,0,1); tr=`translate(${a.cx} ${a.cy}) scale(${k}) translate(${-a.cx} ${-a.cy})`;
    } else if(a.inn==='stamp'){
      const p=clamp(T/0.26,0,1), k=1+1.2*(1-easeOutCubic(p));
      op=clamp(p*3,0,1); tr=`translate(${a.cx} ${a.cy}) scale(${k}) translate(${-a.cx} ${-a.cy})`;
    } else if(a.inn==='drop'){
      const p=clamp(T/0.4,0,1); op=clamp(p*3,0,1); tr=`translate(0 ${(-(1-easeOutBack(p))*140).toFixed(1)})`;
    } else if(a.inn==='slide'){
      const p=clamp(T/0.45,0,1); op=clamp(p*2,0,1); tr=`translate(${((1-easeOutCubic(p))*160).toFixed(1)} 0)`;
    } else if(a.inn==='rise'){
      const p=clamp(T/0.5,0,1); op=p; tr=`translate(0 ${((1-easeOutCubic(p))*60).toFixed(1)})`;
    } else if(a.inn==='fade'){
      op=clamp(T/0.35,0,1);
    } else if(a.inn==='draw'){
      const p=easeOutCubic(clamp(T/0.5,0,1));
      el.querySelectorAll('[data-len]').forEach(n=>n.style.strokeDashoffset=(1-p)*n.dataset.len);
    } else if(a.inn==='write'){
      const p=clamp(T/0.55,0,1);
      el.setAttribute('clip-path',''); op=T<0?0:1;
      el.style.clipPath=`inset(0 ${((1-p)*100).toFixed(1)}% 0 0)`;
    }
  }
  if(a.until!=null && t>=a.until) op=0;
  if(a.loop){
    const [kind,p1,p2]=a.loop.split(':');
    const L=t-(a.from??0);
    if(kind==='spin') tr+=` rotate(${(L*360/parseFloat(p1))%360} ${a.ox} ${a.oy})`;
    else if(kind==='bob') tr+=` translate(0 ${(Math.sin(L*2*Math.PI/parseFloat(p2))*parseFloat(p1)).toFixed(2)})`;
    else if(kind==='shake') tr+=` rotate(${(Math.sin(L*2*Math.PI/parseFloat(p2))*parseFloat(p1)).toFixed(2)} ${a.ox} ${a.oy})`;
    else if(kind==='blink') op*= (Math.floor(L/parseFloat(p1))%2===0)?1:0.25;
    else if(kind==='twinkle') op*=0.55+0.45*Math.sin(L*2*Math.PI/parseFloat(p1));
    else if(kind==='flutter'){
      const x=a.ox+Math.sin(L*1.3)*130+L*40, y=a.oy-L*120+Math.sin(L*5)*26;
      tr+=` translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(Math.sin(L*9)*14).toFixed(1)})`;
    }
  }
  el.style.opacity=op;
  el.setAttribute('transform',(a.base+' '+tr).trim());
}

window.renderFrame=function(t){
  ready();
  let seg=SEGS[0];
  for(const s of SEGS){ if(t>=s.start) seg=s; }
  for(const s of SEGS) s.dom.style.display=(s===seg)?'block':'none';

  // leggero zoom lento della "camera", come in un video montato
  const u=clamp((t-seg.start)/(seg.end-seg.start),0,1);
  const k=ART_SCALE*(1+0.035*u);
  seg.dom.querySelector('.cam').setAttribute('transform',`translate(540 ${ART_TOP}) scale(${k.toFixed(4)}) translate(-540 ${-ART_TOP})`);

  // didascalia della battuta corrente, scritta a macchina
  let cap=seg.caps[0];
  for(const c of seg.caps){ if(t>=c.bt.start) cap=c; }
  for(const c of seg.caps) c.el.style.display=(c===cap)?'block':'none';
  const f=clamp((t-cap.bt.s0)/(cap.bt.s1-cap.bt.s0),0,1);
  const pos=f*cap.total;
  cap.chars.forEach((n,i)=>{ n.style.opacity=clamp((pos-cap.cum[i])/1.4+ (f>=1?1:0),0,1).toFixed(3); });

  for(const a of seg.anims) applyAnim(a,t);
  const tag=seg.dom.querySelector('#tag-parte');
  if(tag){ const p=clamp((t-seg.tagAt)/0.3,0,1); tag.style.opacity=p; tag.style.transform=`translateX(-50%) scale(${(0.6+0.4*easeOutBack(p)).toFixed(3)})`; }
};

/* stato "a riposo" di una scena per i controlli: tutto visibile, testo completo */
window.settle=function(visualId){
  ready();
  const seg=SEGS.find(s=>s.dom.id===visualId);
  const tEnd=seg.end-0.01;
  window.renderFrame(tEnd);
  return {caps:seg.caps.map(c=>c.bt.id)};
};
window.segments=()=>{ ready(); return SEGS.map(s=>({id:s.dom.id,visual:s.visual,start:s.start,end:s.end,beats:s.beats.map(b=>b.id)})); };
window.showCaption=function(visualId, beatId){
  const seg=SEGS.find(s=>s.dom.id===visualId);
  seg.caps.forEach(c=>{ c.el.style.display=c.bt.id===beatId?'block':'none'; if(c.bt.id===beatId) c.chars.forEach(n=>n.style.opacity=1); });
};
window.__READY__=true;
</script>
